<style>
  .admin { padding: 28px 0 60px; }
  .admin h1 { font: 800 28px/1.1 var(--display); margin: 0 0 4px; }
  .admin .sub { color: var(--muted); margin: 0 0 20px; }
  .login { max-width: 420px; }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field label { font: 700 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .field textarea { min-height: 70px; resize: vertical; }
  .field .hint { font-size: 12px; color: var(--faint); }
  .grid-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .grid-form .full { grid-column: 1 / -1; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  .bar .who { margin-left: auto; color: var(--muted); font-size: 13px; }
  .msg { min-height: 1.2em; font-size: 14px; margin: 8px 0; }
  .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
  .tbl-actions { display: flex; gap: 6px; }
  .pub { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn.danger { border-color: rgba(239, 68, 68, .5); color: var(--red); }
  .drafts { color: var(--orange); font-weight: 700; }
  @media (max-width: 720px) { .grid-form { grid-template-columns: minmax(0, 1fr); } }
</style>
